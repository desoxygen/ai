name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: opencode-tui
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --timeout 20000
        env:
          AISC_TUI_OFFLINE: "1"
          AISC_AGENTS_DIR: ${{ runner.temp }}/ais-agents-ci
          AISC_SESSIONS_DIR: ${{ runner.temp }}/ais-sessions-ci
          AISC_RESULTS_DIR: ${{ runner.temp }}/ais-results-ci

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # exactly the README quickstart path — CI must test what users install
      - run: pip install -e . && pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
        env:
          AISC_TUI_OFFLINE: "1"
          AISC_RESULTS_DIR: ${{ runner.temp }}/ais-results-ci
          OBSIDIAN_VAULT_PATH: ${{ runner.temp }}/vault
