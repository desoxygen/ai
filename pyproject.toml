[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scientist"
version = "0.1b1"
description = "AI-Scientist: консоль-лаборатория для исследования"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AI Scientist Source Code License" }
dependencies = [
  "anthropic",
  "aider-chat",
  "backoff",
  "openai",
  "google-generativeai",
  "requests",
  "rich",
  "questionary",
  "prompt_toolkit",
  "matplotlib",
  "pypdf",
  "pymupdf4llm",
  "torch",
  "numpy",
  "transformers",
  "datasets",
  "tiktoken",
  "wandb",
  "tqdm",
]

[project.scripts]
aiscientist = "ai_scientist.console.cli:main"

[tool.setuptools.packages.find]
include = ["ai_scientist", "ai_scientist.*"]
