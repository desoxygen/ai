[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scientist"
version = "0.1b1"
description = "AI-Scientist: консоль-лаборатория для исследования"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AI Scientist Source Code License" }
dependencies = [
  "anthropic",
  "aider-chat",
  "backoff",
  "openai",
  "google-generativeai",
  "requests",
  "rich",
  "questionary",
  "prompt_toolkit",
  "matplotlib",
  "pypdf",
  "pymupdf4llm",
  "torch",
  # Floors below keep pip's resolver out of pre-cp312 sdists (numpy 1.24.3,
  # tiktoken 0.4.0, aiohttp 3.8.4) that aider-chat backtracking otherwise picks
  "numpy>=1.26",
  "transformers>=4.40",
  "datasets>=2.18",
  "tiktoken>=0.5",
  "aiohttp>=3.9",
  "wandb",
  "tqdm",
]

[project.scripts]
aiscientist = "ai_scientist.console.cli:main"

[tool.setuptools.packages.find]
include = ["ai_scientist", "ai_scientist.*"]
