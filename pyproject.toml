[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scientist"
version = "0.2b3"
description = "AI-Scientist: консоль-лаборатория для исследования"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AI Scientist Source Code License" }
dependencies = [
  "anthropic",
  "aider-chat",
  "backoff",
  "openai",
  "requests",
  "pyalex",  # novelty engine: --engine openalex
  "rich",
  "questionary",
  "prompt_toolkit",
  "matplotlib",
  "pypdf",
  "pymupdf4llm",
  "torch",
  # Floors below keep pip's resolver out of pre-cp312 sdists (numpy 1.24.3,
  # tiktoken 0.4.0, aiohttp 3.8.4) that aider-chat backtracking otherwise picks
  "numpy>=1.26",
  "transformers>=4.40",
  "datasets>=2.18",
  "tiktoken>=0.5",
  "aiohttp>=3.9",
  "wandb",
  "tqdm",
]

[project.scripts]
aiscientist = "ai_scientist.console.cli:main"

[tool.setuptools.packages.find]
include = ["ai_scientist", "ai_scientist.*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "example_papers", "review_iclr_bench", "templates", ".venv"]

[tool.ruff.lint]
# E4/E7/E9 = style + real errors, F = pyflakes (unused imports, undefined
# names, f-string issues). Kept conservative so legacy science code is not
# churned; E731 (lambda-assign) and E741 (ambiguous l/I/O) are allowed.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]
